name: Judge gateway — verify locked deployment config (NO DEPLOY)
on:
  push:
    branches:
      - deploy/judge-only-locked
  workflow_dispatch:
permissions:
  contents: read
jobs:
  locked-build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify config has no activation, database, or secret bindings
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const content = readFileSync('judge-gateway/wrangler.jsonc','utf8');
          const cfg = JSON.parse(content.replace(/^\s*\/\/.*$/gm,''));
          if (cfg.name !== 'socialspark-private-judge-gateway') throw Error('Wrong Worker target');
          if (cfg.main !== './worker.mjs') throw Error('Wrong worker entrypoint');
          if (cfg.d1_databases || cfg.vars || cfg.services || cfg.unsafe || cfg.routes || cfg.triggers || cfg.secrets) throw Error('Unexpected binding/activation');
          if (!content.includes('LOCKED INITIAL DEPLOYMENT')) throw Error('Missing lock marker');
          const source = readFileSync('judge-gateway/worker.mjs','utf8');
          if (!source.includes("JUDGE_GATE_ENABLED==='EXPLICITLY_APPROVED'") ||
              !source.includes("JUDGE_BILLING_HARD_CAP_CONFIRMED==='YES_PROVIDER_ENFORCED'")) throw Error('Missing explicit activation gates');
          console.log('Verified: locked Worker config has no D1, vars, secrets or activation flags');
          NODE
      - name: Compile Worker only, never deploy
        run: npx --yes wrangler@4 deploy --dry-run --config judge-gateway/wrangler.jsonc --outdir /tmp/judge-locked-bundle
      - name: Confirm bundle exists
        run: test -s /tmp/judge-locked-bundle/worker.js || test -s /tmp/judge-locked-bundle/worker.mjs
